# It is reusable workflow that can be called in other workflow
# Purpose :
# Unless terraform Init, Validate, Plan checks pass, the commit to the target branch will not happen or the PR will not pass & cannot be merged to the destination branch.
# Unless Checkov, Trivy code scan checks pass, the commit to the target branch will not happen or the PR will not pass & cannot be merged to the destination branch.
# If there are no examples/main.tf file in the repo, commit to the target branch or the PR will not pass & cannot be merged to the destination branch.
# If there are no README.md file in the root of the repo, commit to the target branch or the PR will not pass & cannot be merged to the destination branch.
# If any of the above four checks fail, the commit to the target branch or the PR will not pass & cannot be merged to the destination branch

name: iac-code-quality-checks
run-name: ${{ github.actor }} has triggered the GitHub Actions
# Controls when the action will run. Invokes the workflow on push events on all branches except for the main/master branches and on pull requests
on:
  workflow_call:
    secrets:
      # TF_API_TOKEN:
      #   required: true
      INFRACOST_API_KEY:
        required: true
  # Triggers the workflow on push or pull request events
  push:
    branches-ignore:
      - "main"
      - "master"
    paths-ignore:
      - "**/README.md"
  pull_request:
    branches: ["develop", "release", "master", "main"]
    types:
      [
        assigned,
        unassigned,
        labeled,
        unlabeled,
        opened,
        edited,
        closed,
        reopened,
        synchronize,
        converted_to_draft,
        ready_for_review,
        locked,
        unlocked,
        review_requested,
        review_request_removed,
        auto_merge_enabled,
        auto_merge_disabled,
      ]
env:
  # tfcode_path: "."
  # TF_CLOUD_ORGANIZATION: "cloud-infra-devops-architect"
  # TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  # TF_WORKSPACE: "gh-actions-pipeline"
  # AWS_REGION: ${{ secrets.AWS_REGION }}
  CONFIG_DIRECTORY: "."
  TF_LOG: INFO

jobs:
  pre-commit-hooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.2.2
        with:
          tflint_version: v0.61.0

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  check-required-files:
    runs-on: ubuntu-latest
    needs: pre-commit-hooks
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check required files exist
        run: |
          missing=0
          if [ ! -f "examples/main.tf" ]; then
            echo "::error::Missing required file: examples/main.tf"
            missing=1
          fi
          if [ ! -f "examples/README.md" ]; then
          echo "::error::Missing required file: examples/README.md"
          missing=1
          fi
          if [ ! -f "README.md" ]; then
            echo "::error::Missing required file: README.md"
            missing=1
          fi
          if [ ! -f "trivy.yaml" ]; then
            echo "::error::Missing required file: trivy.yaml"
            missing=1
          fi
          if [ ! -f ".tflint.hcl" ]; then
            echo "::error::Missing required file: .tflint.hcl"
            missing=1
          fi
          exit $missing

  infracost:
    runs-on: ubuntu-latest
    needs: check-required-files
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost cost estimate
        run: |
          infracost breakdown \
            --path=${{ env.CONFIG_DIRECTORY }} \
            --format=json \
            --out-file=/tmp/infracost.json

      - name: Show cost breakdown in logs
        run: infracost output --path=/tmp/infracost.json --format=table

      - name: Post Infracost comment on PR
        if: github.event_name == 'pull_request'
        run: |
          infracost comment github \
            --path=/tmp/infracost.json \
            --repo=${{ github.repository }} \
            --github-token=${{ github.token }} \
            --pull-request=${{ github.event.pull_request.number }} \
            --behavior=update

  checkov-scan:
    runs-on: ubuntu-latest
    needs: check-required-files
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Checkov scan
        uses: bridgecrewio/checkov-action@v12.3092.0
        with:
          directory: ${{ env.CONFIG_DIRECTORY }}
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          skip_check: CKV_TF_1
          soft_fail: false
        continue-on-error: false

      # - name: Upload Checkov SARIF report
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: results.sarif
      #     category: checkov
  trivy-scan:
    runs-on: ubuntu-latest
    needs: check-required-files
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run Trivy config scan for Terraform
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "config"
          ignore-unfixed: true
          scan-ref: ${{ env.CONFIG_DIRECTORY }}
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
          exit-code: "1"
          trivy-config: trivy.yaml
      - name: Fail on Trivy misconfiguration findings
        if: failure()
        run: |
          echo "::error::Trivy detected misconfiguration errors. Review the scan output above."
          exit 1
  tflint-scan:
    runs-on: ubuntu-latest
    needs: check-required-files
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.2.2
        with:
          tflint_version: v0.61.0
      - name: Run TFLint
        run: |
          tflint --init
          tflint --chdir=${{ env.CONFIG_DIRECTORY }} --format=compact
        continue-on-error: false
  amazonq-rules-check:
    runs-on: ubuntu-latest
    needs: check-required-files
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify Amazon Q rules file exists
        run: |
          if [ ! -f ".amazonq/rules/vpc-module-rules.md" ]; then
            echo "::error::Missing required file: .amazonq/rules/vpc-module-rules.md"
            exit 1
          fi
          echo "✅ Amazon Q rules file found: .amazonq/rules/vpc-module-rules.md"

      - name: Validate rules against module conventions
        run: |
          set -e
          errors=0

          # Rule: map_public_ip_on_launch must be false
          if grep -rn "map_public_ip_on_launch\s*=\s*true" --include="*.tf" .; then
            echo "::error::map_public_ip_on_launch must be false on all subnets (.amazonq/rules/vpc-module-rules.md#security)"
            errors=$((errors + 1))
          fi

          # Rule: No hardcoded SNS ARNs
          if grep -rn '"arn:aws:sns:' --include="*.tf" .; then
            echo "::error::Hardcoded SNS ARNs detected — use var.cloudwatch_alarm_actions (.amazonq/rules/vpc-module-rules.md#cloudwatch-alarms)"
            errors=$((errors + 1))
          fi

          # Rule: EIP domain must use 'domain = "vpc"' not deprecated 'vpc = true'
          if grep -rn 'vpc\s*=\s*true' --include="*.tf" .; then
            echo "::error::Deprecated aws_eip attribute 'vpc = true' detected — use 'domain = \"vpc\"' (.amazonq/rules/vpc-module-rules.md#what-to-avoid)"
            errors=$((errors + 1))
          fi

          # Rule: Required files must exist
          for f in main.tf variables.tf outputs.tf versions.tf flow_logs.tf cloudwatch_alarms.tf examples/main.tf; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required module file: $f (.amazonq/rules/vpc-module-rules.md#file-structure)"
              errors=$((errors + 1))
            fi
          done

          # Rule: All variables must have a description
          if grep -n "^variable" variables.tf | grep -v "description" > /dev/null 2>&1; then
            missing=$(awk '/^variable/{name=$0} !/description/ && name{print name; name=""}' variables.tf)
            if [ -n "$missing" ]; then
              echo "::warning::Some variables may be missing descriptions — verify variables.tf (.amazonq/rules/vpc-module-rules.md#variable-definitions)"
            fi
          fi

          # Rule: Outputs must have descriptions
          if grep -A1 "^output" outputs.tf | grep -v "description" | grep -v "^--$" | grep "^output" > /dev/null 2>&1; then
            echo "::warning::Some outputs may be missing descriptions — verify outputs.tf (.amazonq/rules/vpc-module-rules.md#outputs)"
          fi

          if [ $errors -gt 0 ]; then
            echo "::error::Amazon Q rules check failed with $errors violation(s). See .amazonq/rules/vpc-module-rules.md for details."
            exit 1
          fi

          echo "✅ All Amazon Q Developer rules checks passed."

  scan-results:
    runs-on: ubuntu-latest
    needs:
      [
        pre-commit-hooks,
        infracost,
        checkov-scan,
        trivy-scan,
        tflint-scan,
        amazonq-rules-check,
      ]
    if: always()
    steps:
      - name: Scan Results Summary
        run: |
          precommit="${{ needs.pre-commit-hooks.result }}"
          infracost="${{ needs.infracost.result }}"
          checkov="${{ needs.checkov-scan.result }}"
          trivy="${{ needs.trivy-scan.result }}"
          tflint="${{ needs.tflint-scan.result }}"
          amazonq="${{ needs.amazonq-rules-check.result }}"

          status_icon()  { [[ "$1" == "success" ]] && echo "✅ PASSED" || echo "❌ FAILED"; }
          status_color() { [[ "$1" == "success" ]] && echo "\e[32m" || echo "\e[31m"; }
          RESET="\e[0m"
          BOLD="\e[1m"
          CYAN="\e[36m"

          echo ""
          echo -e "${BOLD}${CYAN}╔══════════════════════════════════════════════════╗${RESET}"
          echo -e "${BOLD}${CYAN}║       🔍  IaC Security Scan Results Summary      ║${RESET}"
          echo -e "${BOLD}${CYAN}╠══════════════════════════════════════════════════╣${RESET}"
          echo -e "${BOLD}${CYAN}║  Tool              │ Status                      ║${RESET}"
          echo -e "${BOLD}${CYAN}╠════════════════════╪═════════════════════════════╣${RESET}"
          echo -e "${BOLD}${CYAN}║${RESET}  🪝  Pre-commit     │ $(status_color $precommit)${BOLD}$(status_icon $precommit)${RESET}$(status_color $precommit)                     ${RESET}${BOLD}${CYAN}║${RESET}"
          echo -e "${BOLD}${CYAN}║${RESET}  💰  Infracost      │ $(status_color $infracost)${BOLD}$(status_icon $infracost)${RESET}$(status_color $infracost)                     ${RESET}${BOLD}${CYAN}║${RESET}"
          echo -e "${BOLD}${CYAN}║${RESET}  🛡️  Checkov        │ $(status_color $checkov)${BOLD}$(status_icon $checkov)${RESET}$(status_color $checkov)                     ${RESET}${BOLD}${CYAN}║${RESET}"
          echo -e "${BOLD}${CYAN}║${RESET}  🔬  Trivy          │ $(status_color $trivy)${BOLD}$(status_icon $trivy)${RESET}$(status_color $trivy)                     ${RESET}${BOLD}${CYAN}║${RESET}"
          echo -e "${BOLD}${CYAN}║${RESET}  🧹  TFLint         │ $(status_color $tflint)${BOLD}$(status_icon $tflint)${RESET}$(status_color $tflint)                     ${RESET}${BOLD}${CYAN}║${RESET}"
          echo -e "${BOLD}${CYAN}║${RESET}  🤖  Amazon Q Rules │ $(status_color $amazonq)${BOLD}$(status_icon $amazonq)${RESET}$(status_color $amazonq)                     ${RESET}${BOLD}${CYAN}║${RESET}"
          echo -e "${BOLD}${CYAN}╠══════════════════════════════════════════════════╣${RESET}"

          if [[ "$precommit" != "success" || "$infracost" != "success" || "$checkov" != "success" || "$trivy" != "success" || "$tflint" != "success" || "$amazonq" != "success" ]]; then
            echo -e "${BOLD}${CYAN}║${RESET}  ${BOLD}\e[31m⛔  Overall: FAILED — review scan output above${RESET}   ${BOLD}${CYAN}║${RESET}"
            echo -e "${BOLD}${CYAN}╚══════════════════════════════════════════════════╝${RESET}"
            echo ""
            echo "::error::One or more scans failed. pre-commit=$precommit, infracost=$infracost, checkov=$checkov, trivy=$trivy, tflint=$tflint, amazonq=$amazonq"
            exit 1
          fi

          echo -e "${BOLD}${CYAN}║${RESET}  ${BOLD}\e[32m🎉  Overall: ALL SCANS PASSED SUCCESSFULLY!${RESET}      ${BOLD}${CYAN}║${RESET}"
          echo -e "${BOLD}${CYAN}╚══════════════════════════════════════════════════╝${RESET}"
          echo ""

